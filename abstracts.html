<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Book | JC2B 2026</title>
    <meta name="theme-color" content="#061a2b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=2" />
  </head>
  <body data-page="abstracts">
    <header class="site-header" id="site-header"></header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow" data-i18n="abstractsEyebrow">Livret</span>
          <h1 data-i18n="abstractsTitle">Livret des abstracts</h1>
          <p data-i18n="abstractsLead">Consultez le livret de la JC2B 2026 ci-dessous.</p>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="book-viewer">
            <iframe
              class="book-pdf-frame"
              src="data/book.pdf"
              title="JC2B 2026 Book"
            ></iframe>
          </div>
        </div>
      </section>
      <section class="registration-band">
        <div class="container registration-band-inner">
          <div>
            <h2 data-i18n="homeRegistrationTitle"></h2>
            <p data-i18n="homeRegistrationText"></p>
          </div>
          <a class="btn btn-primary" href="registration.html" data-i18n="register"></a>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/site-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/app.js"></script>
    <script src="js/i18n.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      if (window.innerWidth <= 980 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        const viewer = document.querySelector(".book-viewer");
        viewer.innerHTML = "";
        viewer.style.maxHeight = "80vh";
        viewer.style.overflowY = "auto";
        pdfjsLib.getDocument("data/book.pdf").promise.then(async (pdf) => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const unscaled = page.getViewport({ scale: 1 });
            const scale = (viewer.clientWidth / unscaled.width) * dpr;
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.style.width = "100%";
            canvas.style.height = "auto";
            canvas.style.display = "block";
            viewer.appendChild(canvas);
            page.render({ canvasContext: canvas.getContext("2d"), viewport });
          }
        });
      }
    </script>
  </body>
</html>
