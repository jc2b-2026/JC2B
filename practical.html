<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Practical info | JC2B 2026</title>
    <meta name="theme-color" content="#061a2b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="practical">
    <header class="site-header" id="site-header"></header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow" data-i18n="practicalEyebrow"></span>
          <h1 data-i18n="practicalTitle"></h1>
          <p data-i18n="practicalLead"></p>
        </div>
      </section>
      <section class="section">
        <div class="container practical-grid">
          <article class="venue-card">
            <span data-i18n="venueTitle">Lieu</span>
            <h3 data-config="venue">I2BC</h3>

            <p>
              Campus CNRS<br>
              1 avenue de la Terrasse, 91190 Gif-sur-Yvette
            </p>

            <iframe
              class="venue-map"
              title="Localisation de l’I2BC"
              src="https://maps.google.com/maps?q=48.704027,2.132399&amp;z=16&amp;output=embed"
              width="600"
              height="300"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              allowfullscreen>
            </iframe>

            <a
              class="btn btn-primary"
              href="https://www.google.com/maps/dir/?api=1&amp;destination=48.704027%2C2.132399"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="getDirections">
              Calculer mon itinéraire
            </a>
          </article>
          <div class="practical-stack">
            <article class="info-panel">
              <h3 data-i18n="accessTitle"></h3>
              <p data-i18n="accessText"></p>
            </article>
            <article class="info-panel">
              <h3 data-i18n="accessibilityTitle"></h3>
              <p data-i18n="accessibilityText"></p>
            </article>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/site-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/app.js"></script>
    <script src="js/i18n.js"></script>
  </body>
</html>
